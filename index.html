<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мобильное меню</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <aside class="mobile-menu">
        
        <header class="mobile-menu__header">
            <button class="menu-btn menu-btn--pink">
                <img src="./logo/burger.svg" alt="Закрыть" class="menu-icon">
            </button>
            
            <a href="#" class="mobile-menu__logo">
                <img src="./logo/group.svg" alt="CPS Логотип" class="mobile-logo-img">
            </a>
            
            <button class="menu-btn menu-btn--pink">
                <img src="./logo/search.svg" alt="Поиск" class="menu-icon">
            </button>
        </header>

        <nav class="mobile-menu__nav">
            <ul class="mobile-menu__list">
                <li class="mobile-menu__item mobile-menu__item--active">
                    <a href="#" class="mobile-menu__link">Ремонт техники</a>
                </li>
                <li class="mobile-menu__item">
                    <a href="#" class="mobile-menu__link">Услуги и сервисы</a>
                </li>
                <li class="mobile-menu__item">
                    <a href="#" class="mobile-menu__link">Корпоративным клиентам</a>
                </li>
                <li class="mobile-menu__item">
                    <a href="#" class="mobile-menu__link">Продавцам техники</a>
                </li>
                <li class="mobile-menu__item">
                    <a href="#" class="mobile-menu__link">Партнерам</a>
                </li>
                <li class="mobile-menu__item">
                    <a href="#" class="mobile-menu__link">Производителям</a>
                </li>
                <li class="mobile-menu__item">
                    <a href="#" class="mobile-menu__link">Наши сервисные центры</a>
                </li>
                <li class="mobile-menu__item">
                    <a href="#" class="mobile-menu__link">Контакты</a>
                </li>
            </ul>
        </nav>

        <footer class="mobile-menu__footer">
            <div class="mobile-menu__actions">
                <button class="menu-btn">
                    <img src="./logo/call.svg" alt="Позвонить" class="menu-icon">
                </button>
                <button class="menu-btn">
                    <img src="./logo/chat.svg" alt="Чат" class="menu-icon">
                </button>
                <button class="menu-btn">
                    <img src="./logo/profile.svg" alt="Профиль" class="menu-icon">
                </button>
            </div>

            <div class="mobile-menu__contacts">
                <span class="mobile-menu__email">mail@cps.com</span>
                <span class="mobile-menu__phone">8 800 890 8900</span>
            </div>

            <div class="mobile-menu__lang">
                <span class="lang-option lang-option--active">RU</span>
                <span class="lang-option">EN</span>
                <span class="lang-option">CH</span>
            </div>
        </footer>
        
    </aside>
</body>
</html>
